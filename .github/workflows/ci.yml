name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,api,ml,spark]"
      - run: ruff check src pipelines ml ai services tests database
      - run: mypy src
      - run: pytest -m "not integration" --cov=mednexus --cov-report=term-missing
      - run: docker compose config --quiet

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/Dockerfile.spark -t mednexus-spark:test .
      - run: docker build -f infrastructure/docker/Dockerfile.api -t mednexus-api:test .
      - run: docker build -f infrastructure/docker/Dockerfile.web -t mednexus-web:test .
