global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "prometheus:9090"

  # We'll enable these when our services are added.

  - job_name: "ml-api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "ml-api:8000"

