[project]
name = "mednexus-ai"
version = "0.1.0"
description = "Production-style healthcare ML and agentic AI intelligence platform"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.4",
    "pyarrow>=17,<20",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "psycopg2-binary>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "redis>=5,<6",
    "boto3>=1.35,<2",
    "confluent-kafka>=2.5,<3",
    "structlog>=24,<26",
    "tenacity>=8,<10",
    "requests>=2.32,<3",
    "httpx>=0.27,<1",
    "cryptography>=44,<51",
]

[project.optional-dependencies]

spark = [
    "pyspark>=3.5,<3.6"
]

ml = [
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",
    "lightgbm>=4.5,<5",
    "mlflow==2.17.2",
    "shap>=0.46,<1",
    "imbalanced-learn>=0.12,<1",
]

ai = [
    "torch>=2.4",
    "transformers>=4.44,<5",
    "sentence-transformers>=3,<6",
    "faiss-cpu>=1.8,<2",
    "langchain>=0.3,<1",
    "langgraph>=0.2,<1",
]

api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "prometheus-client>=0.21,<1",
]

dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6,<7",
    "pandas-stubs>=2.2,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
cache_dir = "work/pytest-cache"
markers = [
    "integration: requires local infrastructure and is excluded from the default test run",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faiss", "joblib", "sentence_transformers", "sklearn.*"]
ignore_missing_imports = true
